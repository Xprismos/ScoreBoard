var sg=S.sg.map(function(s,i){return '<div class="tbl"><div><b>'+esc(s.t)+'</b><div class="mu sm">'+esc(s.c)+(s.n?' · '+esc(s.n):'')+'</div></div><div class="row"><button class="btn s gh" data-sgu="'+i+'">Use</button><button class="btn s gh" data-sgx="'+i+'">Dismiss</button></div></div>'}).join('');

ect class="in f1" name="w" aria-label="Winning option">'+m.o.map(function(o,i){return '<option value="'+i+'">'+esc(o.n)+'</option>'}).join('')+'</select><button class="btn s go">Declare winner</button><button class="btn s gh" type="button" data-res="'+m.id+':-1">Refund all</button></form></div>'}).join('')+'</div></section>'}

function reset(){return authCard('Set a new password','Choose a new password for your account.','<form class="col" data-f="reset"><label class="lb">New password<input class="in" name="p" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn go">Save password</button></form>','')}
var pages={reset:reset,home:home,markets:markets,market:market,login:login,signup:signup,forgot:forgot,picks:picks,wallet:wallet,fund:fund,results:results,account:account,suggest:suggest,terms:terms,soon:soon,pools:pools,pool:pool,admin:admin,how:function(){return '<div style="padding-top:8px">'+how()+trust()+'</div>'}};
var later=['privacy','withdraw','help','settings'];
function pg(){var p=location.hash.slice(1)||'home';if(/access_token|type=recovery/.test(p))return 'reset';if(remote&&(p=='pools'||p=='pool'))return 'soon';return pages[p]?p:later.indexOf(p)>-1?'soon':'nf'}
function render(top){var p=pg(),need=['picks','wallet','fund','account','pools','pool'];
if(need.indexOf(p)>-1&&!me()){flash=[1,'Please log in as a player first.'];tab='p';p='login'}
if(p=='admin'&&!adm()){flash=[1,'Admins only. Log in with the Admin tab.'];tab='a';p='login'}
var body=p=='nf'?nf():pages[p]();
q('#app').innerHTML=banner()+nav(p)+'<main>'+body+'</main>'+(['home','markets','how','terms','suggest'].indexOf(p)>-1?foot():'')+tabs(p);
if(top)window.scrollTo(0,0);flash=null}
function go(h){if(location.hash=='#'+h)render();else location.hash=h}

function resolve(id,w){var m=mk(id);if(m.st=='resolved')return;var t=sum(m),W=w>=0?m.o[w].a:0,L=t-W;if(w>=0&&(L<=0||W<=0))w=-1;m.st='resolved';m.w=w;
S.p.forEach(function(p){if(p.mid!=m.id||p.st!='open')return;var u=S.u.filter(function(x){return x.id==p.uid})[0];
if(w<0){p.st='refund';p.out=p.x}else if(p.s==w){p.st='won';p.out=p.x*(1+0.9*L/W)}else{p.st='lost';p.out=0}
if(u)u.bal+=p.out});save()}
function settle(p,w){var u,n=p.m.length,pot=n*p.e,win=p.m.filter(function(x){return x.o==w});if(w>=0&&!win.length)w=-1;p.st='done';p.w=w;
if(p.ty=='money'){p.m.forEach(function(x){var pay=w<0?p.e:(x.o==w?pot*(1-POOLFEE)/win.length:0),u=S.u.filter(function(z){return z.id==x.u})[0];if(u)u.bal+=pay})}save()}

async function sync(){
var r=await sb.from('markets').select('id,category,title,source,closes_at,status,winner_option,market_options(id,label,position,pool_kobo)').order('id');
if(r.error){dbErr=r.error.message;S.mk=[];return}dbErr=null;
S.mk=r.data.map(function(m){var o=m.market_options.sort(function(a,b){return a.position-b.position});return {id:m.id,cat:m.category,t:m.title,src:m.source,cl:Date.parse(m.closes_at),st:m.status,w:o.findIndex(function(x){return x.id==m.winner_option}),o:o.map(function(x){return {id:x.id,n:x.label,a:x.pool_kobo/100}})}});
S.u=[];S.p=[];S.tx=[];S.me=null;S.sg=[];S.ml=[];
var ss=await sb.auth.getSession(),us=ss.data.session&&ss.data.session.user;if(!us)return;
var pr=await sb.from('profiles').select('name,role,balance_kobo').eq('id',us.id).single();if(!pr.data)return;
S.u=[{id:us.id,n:pr.data.name||us.email,e:us.email,bal:pr.data.balance_kobo/100}];S.me={r:pr.data.role=='admin'?'a':'p',id:us.id};
var pk=await sb.from('picks').select('market_id,option_id,stake_kobo,status,payout_kobo').eq('user_id',us.id).order('id');
(pk.data||[]).forEach(function(p){var m=mk(p.market_id);if(!m)return;S.p.push({uid:us.id,mid:p.market_id,s:m.o.findIndex(function(x){return x.id==p.option_id}),x:p.stake_kobo/100,st:p.status,out:p.payout_kobo/100})});
var lg=await sb.from('wallet_ledger').select('amount_kobo').eq('user_id',us.id).eq('kind','topup').order('id');
(lg.data||[]).forEach(function(x){S.tx.push({u:us.id,a:x.amount_kobo/100,n:'Top-up'})});
if(S.me.r=='a'){var sg=await sb.from('suggestions').select('id,title,category,note').order('id',{ascending:false});S.sg=(sg.data||[]).map(function(x){return {id:x.id,t:x.title,c:x.category,n:x.note}});var ml=await sb.from('mailing_list').select('email');S.ml=(ml.data||[]).map(function(x){return x.email})}}
async function doResolve(id,w){var m=mk(id);if(remote){var r=await sb.rpc('resolve_market',{p_market:id,p_option:w>=0?m.o[w].id:null});if(r.error){alert(r.error.message);return}await sync()}else resolve(id,w)}
async function boot(){q('#app').innerHTML='<p class="mu" style="padding:48px 20px">Loading…</p>';
if(window.supabase){try{sb=window.supabase.createClient(SB_URL,SB_KEY);var pr=await Promise.race([fetch(SB_URL+'/rest/v1/',{headers:{apikey:SB_KEY}}),new Promise(function(_,j){setTimeout(j,4000)})]);remote=!!pr}catch(e){remote=false}}
if(remote){sb.auth.onAuthStateChange(function(ev){if(ev=='PASSWORD_RECOVERY')go('reset')});try{await sync()}catch(e){dbErr=String(e.message||e)}}
render()}
document.addEventListener('click',async function(e){var t=e.target.closest('[data-open],[data-cat],[data-side],[data-amt],[data-res],[data-tab],[data-act],[data-fm],[data-pj],[data-pw],[data-pp],[data-sgu],[data-sgx]');if(!t)return;var d=t.dataset;
if(d.open){S.sel=+d.open;side=d.opt!=null?+d.opt:0;save();if(t.tagName=='BUTTON')go('market')}
else if(d.cat){cat=d.cat;if(t.tagName=='A'){if(pg()=='markets')render();return}render()}
else if(d.side){side=+d.side;render()}
else if(d.amt){stake=+d.amt;render()}
else if(d.tab){tab=d.tab;render()}
else if(d.fm){fm=d.fm;render()}
else if(d.pp){S.pp=+d.pp;save()}
else if(d.res){var r=d.res.split(':');await doResolve(+r[0],+r[1]);flash=[0,'Result saved and payouts released.'];render()}
else if(d.sgx!=null){var sx=S.sg[+d.sgx];if(remote&&sx&&sx.id)await sb.from('suggestions').delete().eq('id',sx.id);S.sg.splice(+d.sgx,1);save();render()}
else if(d.sgu!=null){dr={t:S.sg[+d.sgu].t,c:S.sg[+d.sgu].c};flash=[0,'Suggestion loaded into the form below.'];render()}
else if(d.pj!=null){var p=S.pl.filter(function(x){return x.id==S.pp})[0],u=me();if(p.m.some(function(x){return x.u==u.id})){return}
if(p.ty=='money'){if(u.bal<p.e){flash=[1,'Not enough balance for the entry.'];render();return}u.bal-=p.e}
p.m.push({u:u.id,o:+d.pj});save();flash=[0,'You are in. Good luck!'];render()}
else if(d.pw!=null){var p2=S.pl.filter(function(x){return x.id==S.pp})[0];settle(p2,+d.pw);flash=[0,'Result saved.'];render()}
else if(d.act=='out'){if(remote){await sb.auth.signOut();await sync()}else{S.me=null;save()}go('home');render()}
else if(d.act=='seed'){var sr=await sb.rpc('seed_sample_markets');if(sr.error)alert(sr.error.message);await sync();render()}
else if(d.act=='reset'){if(remote){var rr=await sb.rpc(adm()?'reset_all_test_data':'reset_my_test_data');if(rr.error)alert(rr.error.message);await sync()}else{S=seed();save()}flash=[0,'Test data reset.'];go('home');render()}
else if(d.act=='asp'){var tu=tester();S.me={r:'p',id:tu.id};save();go('markets');render()}
else if(d.act=='asa'){S.me={r:'a'};save();go('admin');render()}
else if(d.act=='place'){var m=mk(S.sel),u2=me();
if(!u2){flash=[1,'Log in to make a pick.'];tab='p';go('login');return}
if(!(stake>=100)){alert('The minimum stake is ₦100.');return}
if(stake>u2.bal){alert('Not enough balance. Add money in your wallet.');return}
if(!isOpen(m)){render();return}
if(remote){var pr2=await sb.rpc('place_pick',{p_option:m.o[side].id,p_stake:Math.round(stake*100)});if(pr2.error){alert(pr2.error.message);return}await sync()}else{u2.bal-=stake;m.o[side].a+=stake;S.p.push({id:Date.now(),uid:u2.id,mid:m.id,s:side,x:stake,st:'open'});save()}flash=[0,'Pick placed. Good luck!'];go('picks')}
});
document.addEventListener('input',function(e){var i=e.target;
if(i.id=='stake'){stake=+i.value;var x=q('#est');if(x)x.textContent=fmt(est(mk(S.sel)))}
if(i.id=='q'){term=i.value;q('#grid').innerHTML=grid()}});
document.addEventListener('submit',async function(e){e.preventDefault();var f=e.target,k=f.dataset.f,v={};
Array.prototype.forEach.call(f.elements,function(el){if(el.name)v[el.name]=el.type=='checkbox'?el.checked:el.value.trim()});
var lines=function(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)};
if(k=='login'){if(remote){var lr=await sb.auth.signInWithPassword({email:v.e,password:v.p});if(lr.error){flash=[1,lr.error.message];render();return}await sync();if(tab=='a'&&!adm()){flash=[1,'That account is not an admin.'];render();return}go(adm()?'admin':'markets');return}if(tab=='a'){if(v.e.toLowerCase()=='admin@scoreboard.test'&&v.p=='admin123'){S.me={r:'a'};save();go('admin')}else{flash=[1,'Wrong admin details.'];render()}}
else{var u=S.u.filter(function(x){return x.e==v.e.toLowerCase()&&x.p==v.p})[0];if(u){S.me={r:'p',id:u.id};save();go('markets')}else{flash=[1,'Wrong email or password.'];render()}}}
else if(k=='signup'){if(v.p!=v.c){flash=[1,'The passwords do not match.'];render();return}if(remote){var sr2=await sb.auth.signUp({email:v.e,password:v.p,options:{data:{name:v.n}}});if(sr2.error){flash=[1,sr2.error.message];render();return}if(sr2.data.session){await sync();go('markets')}else{flash=[0,'Check your email to confirm your account, then log in.'];tab='p';go('login')}return}
if(S.u.some(function(x){return x.e==v.e.toLowerCase()})){flash=[1,'That email already has an account.'];render();return}
var n={id:Date.now(),n:v.n,e:v.e.toLowerCase(),t:v.t,p:v.p,bal:10000};S.u.push(n);S.me={r:'p',id:n.id};save();go('markets')}
else if(k=='forgot'){if(remote)await sb.auth.resetPasswordForEmail(v.e,{redirectTo:location.origin+location.pathname});flash=[0,'If that email has an account, a reset link is on its way.'];render()}
else if(k=='reset'){var ur=await sb.auth.updateUser({password:v.p});if(ur.error){flash=[1,ur.error.message];render();return}await sync();flash=[0,'Password updated.'];go('markets')}
else if(k=='join'){var em=f.elements[0].value.trim();if(remote)await sb.from('mailing_list').insert({email:em});else{if(S.ml.indexOf(em)<0)S.ml.push(em);save()}f.reset();alert('Thanks! You are on the mailing list.')}
else if(k=='sug'){if(remote){var se=await sb.from('suggestions').insert({title:v.t,category:v.c,note:v.n,user_id:S.me?S.me.id:null});if(se.error){flash=[1,se.error.message];render();return}}else{S.sg.push({t:v.t,c:v.c,n:v.n,at:Date.now()});save()}flash=[0,'Thank you! We got your suggestion.'];f.reset();render()}
else if(k=='fund'){var amt=+v.amt;if(!(amt>=100)){alert('The minimum is ₦100.');return}busy=true;render();if(remote){await new Promise(function(r){setTimeout(r,1500)});var tr=ENV=='test'?await sb.rpc('test_topup',{p_amount:Math.round(amt*100)}):{error:{message:'Payments are not switched on yet.'}};busy=false;if(tr.error){flash=[1,tr.error.message];render();return}await sync();flash=[0,'Payment successful (test). '+fmt(amt)+' added.'];go('wallet');return}setTimeout(function(){var u3=me();u3.bal+=amt;S.tx.push({u:u3.id,a:amt,n:'Test top-up · '+fm,t:Date.now()});busy=false;save();flash=[0,'Payment successful (test). '+fmt(amt)+' added.'];go('wallet')},1800)}
else if(k=='post'){var c=new Date(v.d).getTime(),o=lines(v.o);if(!(c>Date.now())){flash=[1,'Pick a closing time in the future.'];render();return}
if(o.length<2||o.length>12){flash=[1,'Add between 2 and 12 options.'];render();return}
if(remote){var cr=await sb.rpc('create_market',{p_category:v.c,p_title:v.t,p_source:v.s,p_closes:new Date(c).toISOString(),p_options:o});if(cr.error){flash=[1,cr.error.message];render();return}await sync()}else{S.mk.push({id:Date.now(),cat:v.c,t:v.t,src:v.s,o:o.map(function(n){return {n:n,a:0}}),cl:c,st:'open'});save()}dr=null;flash=[0,'Prediction published. It is now live in Markets.'];render()}
else if(k=='pools'){var m=mk(+v.id);if(remote){var amts=m.o.map(function(o,i){return Math.round(Math.max(0,+v['o'+i]||0)*100)});var pe=await sb.rpc('test_set_pools',{p_market:m.id,p_amounts:amts});if(pe.error){flash=[1,pe.error.message];render();return}await sync()}else{m.o.forEach(function(o,i){o.a=Math.max(0,+v['o'+i]||0)});save()}flash=[0,'Pools saved. Players now see the new amounts.'];render()}
else if(k=='res'){await doResolve(+v.id,+v.w);flash=[0,'Result saved and payouts released.'];render()}
else if(k=='pool'){var o2=lines(v.o);if(o2.length<2||o2.length>12){flash=[1,'Add between 2 and 12 options.'];render();return}var h=me(),id=Date.now(),code=Math.random().toString(36).slice(2,7).toUpperCase();
S.pl.push({id:id,code:code,h:h.id,n:v.n,q:v.q,o:o2,ty:v.y,e:v.y=='money'?Math.max(100,+v.e||100):0,m:[],st:'open'});S.pp=id;save();flash=[0,'Pool created. Share the code '+code+'.'];go('pool')}
else if(k=='joinc'){var p3=S.pl.filter(function(x){return x.code==v.c.toUpperCase()})[0];if(p3){S.pp=p3.id;save();go('pool')}else{flash=[1,'No pool has that code.'];render()}}});
window.addEventListener('hashchange',async function(){if(remote)await sync();render(true)});
window.addEventListener('focus',async function(){if(!remote)return;await sync();if(['market','markets','home','results'].indexOf(pg())>-1)render()});
setInterval(async function(){if(!remote||document.hidden)return;await sync();var x=q('#est');if(x)x.textContent=fmt(est(mk(S.sel)))},20000);
boot();
})();
</script>
